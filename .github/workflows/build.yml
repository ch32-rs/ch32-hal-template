name: Build Template

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"
  push:
    branches: ["*"]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: ["*"]
    paths-ignore:
      - "**.md"

env:
  CARGO_TERM_COLOR: always
  PROJECT_NAME: ch32-blink

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # RV32E — custom JSON targets (nightly + build-std).
          # ch32v00x default variant is v003 (ec); also cover a zmmul (emc) part.
          - mcu_family: ch32v00x
            embassy: true
            use_xwch_extensions: true
          - mcu_family: ch32v00x
            embassy: false
            use_xwch_extensions: true
          - mcu_family: ch32v00x
            mcu: ch32v006k8u6
            embassy: true
            use_xwch_extensions: true
          - mcu_family: ch32v00x
            mcu: ch32v006k8u6
            embassy: false
            use_xwch_extensions: true
          - mcu_family: ch641
            embassy: true
            use_xwch_extensions: true
          - mcu_family: ch641
            embassy: false
            use_xwch_extensions: true

          # Standard rustup targets
          - mcu_family: ch32l103
            target: riscv32imc-unknown-none-elf
            embassy: true
            use_xwch_extensions: true
          - mcu_family: ch32l103
            target: riscv32imc-unknown-none-elf
            embassy: false
            use_xwch_extensions: true
          - mcu_family: ch32v103
            target: riscv32imc-unknown-none-elf
            embassy: true
            use_xwch_extensions: true
          - mcu_family: ch32v103
            target: riscv32imc-unknown-none-elf
            embassy: false
            use_xwch_extensions: true
          - mcu_family: ch32v203
            target: riscv32imc-unknown-none-elf
            embassy: true
            use_xwch_extensions: true
          - mcu_family: ch32v203
            target: riscv32imc-unknown-none-elf
            embassy: true
            use_xwch_extensions: false
          - mcu_family: ch32v203
            target: riscv32imc-unknown-none-elf
            embassy: false
            use_xwch_extensions: true
          - mcu_family: ch32v208
            target: riscv32imc-unknown-none-elf
            embassy: true
            use_xwch_extensions: true
          - mcu_family: ch32v208
            target: riscv32imc-unknown-none-elf
            embassy: false
            use_xwch_extensions: true
          - mcu_family: ch32v303
            target: riscv32imafc-unknown-none-elf
            embassy: true
            use_xwch_extensions: true
          - mcu_family: ch32v303
            target: riscv32imafc-unknown-none-elf
            embassy: false
            use_xwch_extensions: true
          - mcu_family: ch32v305
            target: riscv32imafc-unknown-none-elf
            embassy: true
            use_xwch_extensions: true
          - mcu_family: ch32v305
            target: riscv32imafc-unknown-none-elf
            embassy: false
            use_xwch_extensions: true
          - mcu_family: ch32v307
            target: riscv32imafc-unknown-none-elf
            embassy: true
            use_xwch_extensions: true
          - mcu_family: ch32v307
            target: riscv32imafc-unknown-none-elf
            embassy: false
            use_xwch_extensions: true
          - mcu_family: ch32v407
            target: riscv32imc-unknown-none-elf
            embassy: true
            use_xwch_extensions: true
          - mcu_family: ch32v407
            target: riscv32imc-unknown-none-elf
            embassy: false
            use_xwch_extensions: true
          - mcu_family: ch32v467
            target: riscv32imc-unknown-none-elf
            embassy: true
            use_xwch_extensions: true
          - mcu_family: ch32v467
            target: riscv32imc-unknown-none-elf
            embassy: false
            use_xwch_extensions: true
          - mcu_family: ch32x033
            target: riscv32imc-unknown-none-elf
            embassy: true
            use_xwch_extensions: true
          - mcu_family: ch32x033
            target: riscv32imc-unknown-none-elf
            embassy: false
            use_xwch_extensions: true
          - mcu_family: ch32x034
            target: riscv32imc-unknown-none-elf
            embassy: true
            use_xwch_extensions: true
          - mcu_family: ch32x034
            target: riscv32imc-unknown-none-elf
            embassy: false
            use_xwch_extensions: true
          - mcu_family: ch32x035
            target: riscv32imc-unknown-none-elf
            embassy: true
            use_xwch_extensions: true
          - mcu_family: ch32x035
            target: riscv32imc-unknown-none-elf
            embassy: false
            use_xwch_extensions: true
          - mcu_family: ch32h417
            target: riscv32imafc-unknown-none-elf
            embassy: true
            use_xwch_extensions: true
          - mcu_family: ch32h417
            target: riscv32imafc-unknown-none-elf
            embassy: false
            use_xwch_extensions: true
          - mcu_family: ch643
            target: riscv32imc-unknown-none-elf
            embassy: true
            use_xwch_extensions: true
          - mcu_family: ch643
            target: riscv32imc-unknown-none-elf
            embassy: false
            use_xwch_extensions: true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: cargo-generate/cargo-generate-action@latest
        with:
          name: ${{ env.PROJECT_NAME }}
          arguments: >-
            --define mcu_family=${{ matrix.mcu_family }}
            --define embassy=${{ matrix.embassy }}
            --define use_xwch_extensions=${{ matrix.use_xwch_extensions }}
            ${{ matrix.mcu && format('--define mcu={0}', matrix.mcu) || '' }}
      # Move the generated project away from the template so cargo does not get confused.
      # see https://github.com/rust-lang/cargo/issues/9922
      - name: Move generated project to temp dir
        run: |
          mv $PROJECT_NAME ${{ runner.temp }}/
      - name: Use nightly Rust
        run: |
          cd ${{ runner.temp }}/$PROJECT_NAME
          rustup default nightly
          rustup component add rust-src
          rustup update
      - name: Install ${{ matrix.target }} target
        if: ${{ matrix.target }}
        run: |
          cd ${{ runner.temp }}/$PROJECT_NAME
          rustup target add ${{ matrix.target }}
      - name: Build for ${{ matrix.mcu_family }}
        run: |
          cd ${{ runner.temp }}/$PROJECT_NAME
          cargo build --release
