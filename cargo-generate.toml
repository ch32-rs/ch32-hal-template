[template]
cargo_generate_version = ">=0.19"
ignore = [".git", ".github", "README.md"]

[hooks]
pre = ["pre-script.rhai"]
post = ["post-script.rhai"]

# Embassy option
[placeholders.embassy]
type = "bool"
prompt = "Enable embassy (async) support?"
default = true

# WCH custom RISC-V extensions (xwchc, and vector bits on V4x7)
[placeholders.use_xwch_extensions]
type = "bool"
prompt = "Enable WCH custom RISC-V extensions (+xwchc, etc.)?"
default = true

[placeholders.mcu_family]
type = "string"
prompt = "Which MCU family to target?"
choices = [
    "ch32l103",
    "ch32v00x",
    "ch32v103",
    "ch32v203",
    "ch32v208",
    "ch32v303",
    "ch32v305",
    "ch32v307",
    "ch32v407",
    "ch32v467",
    "ch32x033",
    "ch32x034",
    "ch32x035",
    "ch32h417",
    "ch641",
    "ch643",
]
default = "ch32v00x"

# Custom JSON targets are only needed for RV32E (no standard rustup target).
# ch32v00x may need either ec (v003) or emc (v002/004/005/006/007/m007);
# post-script.rhai drops the unused one after the variant is known.
[conditional.'mcu_family != "ch32v00x" && mcu_family != "ch641"']
ignore = ["riscv32ec-unknown-none-elf.json"]

[conditional.'mcu_family != "ch32v00x"']
ignore = ["riscv32emc-unknown-none-elf.json"]

# H417 single-core needs memory/link scripts; dual-core scaffolding is trimmed
# in post-script.rhai when the user did not pick dual-core.
[conditional.'mcu_family != "ch32h417"']
ignore = ["memory-h417.x", "link-h417.x", "h417-dual"]

# CH32H417: single-core V3F blink, or a dual-core (V3F+V5F) workspace.
# Values stay space-free so CI `--define` args are not word-split.
[conditional.'mcu_family == "ch32h417"'.placeholders]
h417_mode = { type = "string", prompt = "CH32H417 core layout?", choices = [
    "single-core",
    "dual-core",
], default = "single-core" }

[conditional.'mcu_family == "ch32l103"'.placeholders]
mcu = { type = "string", prompt = "Which ch32l103 variant to use?", choices = [
    "ch32l103c8t6",
    "ch32l103f7p6",
    "ch32l103f8p6",
    "ch32l103f8u6",
    "ch32l103g8r6",
    "ch32l103k8u6",
], default = "ch32l103f8p6" }

[conditional.'mcu_family == "ch32v00x"'.placeholders]
mcu = { type = "string", prompt = "Which ch32v00x variant to use?", choices = [
    "ch32v003a4m6",
    "ch32v003f4p6",
    "ch32v003f4u6",
    "ch32v003j4m6",
    "ch32v002f4p6",
    "ch32v002f4u6",
    "ch32v002a4m6",
    "ch32v002d4u6",
    "ch32v002j4m6",
    "ch32v004f6p1",
    "ch32v004f6u1",
    "ch32v005e6r6",
    "ch32v005f6u6",
    "ch32v005f6p6",
    "ch32v005d6u6",
    "ch32v006k8u6",
    "ch32v006e8r6",
    "ch32v006f8u6",
    "ch32v006f8p6",
    "ch32v006f4u6",
    "ch32m007g8r6",
    "ch32m007e8r6",
    "ch32m007e8u6",
    "ch32v007e8r6",
    "ch32v007k8u6",
], default = "ch32v003f4p6" }

[conditional.'mcu_family == "ch32v103"'.placeholders]
mcu = { type = "string", prompt = "Which ch32v103 variant to use?", choices = [
    "ch32v103c6t6",
    "ch32v103c8t6",
    "ch32v103c8u6",
    "ch32v103r8t6",
], default = "ch32v103c8t6" }

[conditional.'mcu_family == "ch32v203"'.placeholders]
mcu = { type = "string", prompt = "Which ch32v203 variant to use?", choices = [
    "ch32v203c6t6",
    "ch32v203c8t6",
    "ch32v203c8u6",
    "ch32v203f6p6",
    "ch32v203f8p6",
    "ch32v203f8u6",
    "ch32v203g6u6",
    "ch32v203g8r6",
    "ch32v203k6t6",
    "ch32v203k8t6",
    "ch32v203rbt6",
], default = "ch32v203c8t6" }

[conditional.'mcu_family == "ch32v208"'.placeholders]
mcu = { type = "string", prompt = "Which ch32v208 variant to use?", choices = [
    "ch32v208cbu6",
    "ch32v208gbu6",
    "ch32v208rbt6",
    "ch32v208wbu6",
], default = "ch32v208rbt6" }

[conditional.'mcu_family == "ch32v303"'.placeholders]
mcu = { type = "string", prompt = "Which ch32v303 variant to use?", choices = [
    "ch32v303cbt6",
    "ch32v303rbt6",
    "ch32v303rct6",
    "ch32v303vct6",
], default = "ch32v303rbt6" }

[conditional.'mcu_family == "ch32v305"'.placeholders]
mcu = { type = "string", prompt = "Which ch32v305 variant to use?", choices = [
    "ch32v305fbp6",
    "ch32v305gbu6",
    "ch32v305rbt6",
], default = "ch32v305rbt6" }

[conditional.'mcu_family == "ch32v307"'.placeholders]
mcu = { type = "string", prompt = "Which ch32v307 variant to use?", choices = [
    "ch32v307rct6",
    "ch32v307vct6",
    "ch32v307wcu6",
], default = "ch32v307vct6" }

[conditional.'mcu_family == "ch32v407"'.placeholders]
mcu = { type = "string", prompt = "Which ch32v407 variant to use?", choices = [
    "ch32v407ret6",
    "ch32v407vet6",
    "ch32v407weu6",
], default = "ch32v407vet6" }

[conditional.'mcu_family == "ch32v467"'.placeholders]
mcu = { type = "string", prompt = "Which ch32v467 variant to use?", choices = [
    "ch32v467ret6",
    "ch32v467vet6",
    "ch32v467weu6",
], default = "ch32v467weu6" }

# ch32x033, ch641, ch643, and ch32h417 (v3f-only for now) have a single
# variant per family and are filled in by pre-script.rhai.

[conditional.'mcu_family == "ch32x034"'.placeholders]
mcu = { type = "string", prompt = "Which ch32x034 variant to use?", choices = [
    "ch32x034f8p6",
    "ch32x034f8u6",
], default = "ch32x034f8p6" }

[conditional.'mcu_family == "ch32x035"'.placeholders]
mcu = { type = "string", prompt = "Which ch32x035 variant to use?", choices = [
    "ch32x035c8t6",
    "ch32x035f7p6",
    "ch32x035f8u6",
    "ch32x035g8r6",
    "ch32x035g8u6",
    "ch32x035r8t6",
], default = "ch32x035f7p6" }
