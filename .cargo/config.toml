[build]
{% if target == "riscv32ec-unknown-none-elf" -%}
target = "riscv32ec-unknown-none-elf.json"
{%- elsif target == "riscv32emc-unknown-none-elf" -%}
target = "riscv32emc-unknown-none-elf.json"
{%- else -%}
target = "{{ target }}"
{%- endif %}

[target."{{ target }}"]
{% if use_probe_rs -%}
runner = "probe-rs run --chip {{ probe_rs_chip }}{% if mcu_family == "ch32h417" %} --scan-region ram{% endif %}"
{%- else -%}
runner = "wlink -v flash --enable-sdi-print --watch-serial"
{%- endif %}
{% if xwch_extensions -%}
rustflags = ["-C", "target-feature={{ xwch_features }}"]
{% endif %}

{% if target == "riscv32ec-unknown-none-elf" or target == "riscv32emc-unknown-none-elf" -%}
[unstable]
build-std = ["core"]
json-target-spec = true
{% endif -%}
